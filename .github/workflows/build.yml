name: Build Keep Smiling Forge

on:
  workflow_dispatch:
  push:
    paths:
      - 'KeepSmiling_Forge_1.20.1_source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extraer proyecto
        run: |
          mkdir proyecto
          unzip KeepSmiling_Forge_1.20.1_source.zip -d proyecto

      - name: Compilar mod
        working-directory: proyecto
        run: gradle build

      - name: Guardar archivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: KeepSmiling-Forge-1.20.1
          path: proyecto/build/libs/*.jar
